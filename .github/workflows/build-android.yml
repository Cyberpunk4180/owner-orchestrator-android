name: Build and test Android control app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-orchestrator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Static security checks
        run: python3 tests/check_structure.py

  android-apk:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK using runner preinstalled command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mapfile -t MANAGERS < <(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -r)
          if [ "${#MANAGERS[@]}" -eq 0 ]; then
            echo "::error::Preinstalled Android sdkmanager not found"
            exit 1
          fi
          "${MANAGERS[0]}" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Check output and hash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: owner-orchestrator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
